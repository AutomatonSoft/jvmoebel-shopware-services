name: CI

on:
  push:
    branches:
      - D02-9
  pull_request:
    branches:
      - develop
      - stage
      - main

permissions:
  contents: read

jobs:
  test:
    name: PostgreSQL + Alembic + Pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jvmoebel_ci
          POSTGRES_USER: jvmoebel_ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U jvmoebel_ci_user -d jvmoebel_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: ar

    env:
      POSTGRES_DB: jvmoebel_ci
      POSTGRES_USER: jvmoebel_ci_user
      POSTGRES_PASSWORD: ci_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      AR_WRITE_API_KEY: ci-test-token
      PYTHONPATH: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate AR deployment Compose
        env:
          APP_NETWORK: jvmoebel_ci
        run: docker compose -f compose.deploy.yml config --quiet

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Alembic migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest

  test-analytics:
    name: Analytics PostgreSQL + Alembic + Pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jvmoebel_analytics_ci
          POSTGRES_USER: jvmoebel_analytics_ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U jvmoebel_analytics_ci_user -d jvmoebel_analytics_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: analytics

    env:
      POSTGRES_DB: jvmoebel_analytics_ci
      POSTGRES_USER: jvmoebel_analytics_ci_user
      POSTGRES_PASSWORD: ci_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      ANALYTICS_INGEST_API_KEY: ci-analytics-ingest-token
      ANALYTICS_READ_API_KEY: ci-analytics-read-token
      SALES_CHANNELS: '[{"id":"018f1a2b3c4d5e6f7890abcdef123456","origins":["http://test","https://www.jvmoebel.de"],"market_code":"de"},{"id":"018f1a2b3c4d5e6f7890abcdef0000a1","origins":["http://test","https://www.jvmoebel.at"],"market_code":"at"},{"id":"018f1a2b3c4d5e6f7890abcdef0000c1","origins":["http://test","https://www.jvmoebel.ch"],"market_code":"ch"},{"id":"018f1a2b3c4d5e6f7890abcdef0000e1","origins":["http://test","https://www.jvfurniture.co.uk"],"market_code":"uk"},{"id":"018f1a2b3c4d5e6f7890abcdef0000f1","origins":["http://test","https://www.jvmobili.it"],"market_code":"it"},{"id":"018f1a2b3c4d5e6f7890abcdef0000b1","origins":["http://test","https://www.jvmeble.pl"],"market_code":"pl"}]'
      PYTHONPATH: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Alembic migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest

  validate-analytics-deploy:
    name: Analytics deployment validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: analytics

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Analytics deployment artifact
        shell: bash
        run: |
          set -Eeuo pipefail

          if find . -type l -print -quit | grep -q .; then
            echo "::error::Analytics deployment source contains symbolic links"
            find . -type l
            exit 1
          fi

          for required in \
            Dockerfile \
            pyproject.toml \
            uv.lock \
            alembic.ini \
            docker-compose.yml \
            compose.deploy.yml \
            app/main.py \
            app/worker.py
          do
            if [[ ! -f "${required}" ]]; then
              echo "::error::Analytics is missing ${required}"
              exit 1
            fi
          done

          if [[ ! -d contracts ]]; then
            echo "::error::Analytics is missing contracts/"
            exit 1
          fi

          cp .env.example .env
          sed -i "s/^SALES_CHANNELS='\(.*\)'$/SALES_CHANNELS=\1/" .env

          docker compose -f docker-compose.yml config --quiet

          APP_NETWORK=jvmoebel_ci docker compose -f compose.deploy.yml config --quiet
          APP_NETWORK=jvmoebel_ci docker compose -f compose.deploy.yml config --format json \
            > /tmp/analytics-deploy.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          cfg = json.loads(Path("/tmp/analytics-deploy.json").read_text())
          services = cfg["services"]
          networks = cfg["networks"]

          app_net = networks.get("application") or {}
          if not app_net.get("external"):
              raise SystemExit("application network must be external")
          if app_net.get("name") != "jvmoebel_ci":
              raise SystemExit(f"application network name mismatch: {app_net}")

          db_net = networks.get("database") or {}
          if not db_net.get("internal"):
              raise SystemExit("database network must be internal")

          def service_networks(name: str) -> dict:
              raw = services[name].get("networks") or {}
              if isinstance(raw, list):
                  return {item: {} for item in raw}
              return raw

          def assert_no_host_ports(name: str) -> None:
              ports = services[name].get("ports") or []
              if ports:
                  raise SystemExit(f"{name} must not publish host ports: {ports}")

          for name in ("postgres", "rabbitmq", "migrations", "backend", "worker"):
              if name not in services:
                  raise SystemExit(f"missing service {name}")

          assert_no_host_ports("postgres")
          assert_no_host_ports("rabbitmq")

          postgres_networks = set(service_networks("postgres"))
          if postgres_networks != {"database"}:
              raise SystemExit(
                  f"postgres must stay on database only, got {postgres_networks}"
              )

          rabbit_networks = service_networks("rabbitmq")
          if set(rabbit_networks) != {"database", "application"}:
              raise SystemExit(
                  "rabbitmq must join database and application, "
                  f"got {set(rabbit_networks)}"
              )
          aliases = (rabbit_networks.get("application") or {}).get("aliases") or []
          if "analytics-rabbitmq" not in aliases:
              raise SystemExit(
                  "rabbitmq must expose alias analytics-rabbitmq, "
                  f"got {rabbit_networks}"
              )

          backend_networks = set(service_networks("backend"))
          if backend_networks != {"database", "application"}:
              raise SystemExit(
                  f"backend must join database and application, got {backend_networks}"
              )

          worker_networks = set(service_networks("worker"))
          if worker_networks != {"database"}:
              raise SystemExit(f"worker must stay on database only, got {worker_networks}")

          print("Analytics inter-service network scheme is valid.")
          PY

          echo "Analytics deployment artifact validation passed."

      - name: Build and start Analytics stack
        shell: bash
        run: |
          set -Eeuo pipefail

          docker compose -f docker-compose.yml up -d --build

          echo "Waiting for migrations to finish..."
          status=""
          for _ in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Status}}' jvmoebel_analytics_migrations 2>/dev/null || true)"
            if [[ "${status}" == "exited" ]]; then
              break
            fi
            sleep 5
          done

          if [[ "${status}" != "exited" ]]; then
            echo "::error::Analytics migrations did not finish"
            docker compose -f docker-compose.yml logs migrations
            exit 1
          fi

          migration_code="$(docker inspect -f '{{.State.ExitCode}}' jvmoebel_analytics_migrations)"
          if [[ "${migration_code}" != "0" ]]; then
            echo "::error::Analytics migrations failed"
            docker compose -f docker-compose.yml logs migrations
            exit 1
          fi

          echo "Waiting for backend..."
          for _ in $(seq 1 36); do
            if curl -sf "http://127.0.0.1:8002/docs" >/dev/null; then
              break
            fi
            sleep 5
          done

          if ! curl -sf "http://127.0.0.1:8002/docs" >/dev/null; then
            echo "::error::Analytics backend did not become ready"
            docker compose -f docker-compose.yml logs backend
            exit 1
          fi

          sleep 5

          worker_status="$(docker inspect -f '{{.State.Status}}' jvmoebel_analytics_worker)"
          worker_restarts="$(docker inspect -f '{{.RestartCount}}' jvmoebel_analytics_worker)"
          if [[ "${worker_status}" != "running" ]]; then
            echo "::error::Analytics worker is not running"
            docker compose -f docker-compose.yml logs worker
            exit 1
          fi
          if [[ "${worker_restarts}" != "0" ]]; then
            echo "::error::Analytics worker restarted (${worker_restarts})"
            docker compose -f docker-compose.yml logs worker
            exit 1
          fi

          echo "Analytics stack started: migrations, backend, worker."

      - name: Dump Analytics compose logs
        if: failure()
        shell: bash
        run: docker compose -f docker-compose.yml logs

      - name: Stop Analytics stack
        if: always()
        shell: bash
        run: docker compose -f docker-compose.yml down -v