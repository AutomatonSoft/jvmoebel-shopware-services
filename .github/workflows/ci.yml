name: CI

on:
  pull_request:
    branches:
      - develop
      - stage
      - main

permissions:
  contents: read

jobs:
  test:
    name: PostgreSQL + Alembic + Pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jvmoebel_ci
          POSTGRES_USER: jvmoebel_ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U jvmoebel_ci_user -d jvmoebel_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: ar

    env:
      POSTGRES_DB: jvmoebel_ci
      POSTGRES_USER: jvmoebel_ci_user
      POSTGRES_PASSWORD: ci_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      AR_WRITE_API_KEY: ci-test-token
      PYTHONPATH: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Alembic migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest