<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Analytics{% endblock %}</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: sans-serif; margin: 1.5rem; color: #1a1a1a; }
    nav a { margin-right: 1rem; }
    nav a.current { font-weight: 700; }
    form.filters { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: end; margin: 1rem 0; }
    label { display: flex; flex-direction: column; font-size: 0.85rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left; }
    .empty { margin-top: 1rem; color: #555; }
    .metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: 0.75rem; }
    .metric { border: 1px solid #ccc; padding: 0.75rem; }
    .metric span { display: block; font-size: 0.8rem; color: #555; }
    .metric strong { font-size: 1.25rem; }
    pre { white-space: pre-wrap; background: #f6f6f6; padding: 0.5rem; }
  </style>
</head>
<body>
  <nav>
    <a href="/dashboard?{{ filter_qs }}" class="{% if page == 'overview' %}current{% endif %}">Overview</a>
    <a href="/dashboard/funnel?{{ filter_qs }}" class="{% if page == 'funnel' %}current{% endif %}">Funnel</a>
    <a href="/dashboard/sources?{{ filter_qs }}" class="{% if page == 'sources' %}current{% endif %}">Sources</a>
    <a href="/dashboard/journey?{{ filter_qs }}" class="{% if page == 'journey' %}current{% endif %}">Journey</a>
  </nav>
  <form class="filters" method="get">
    <label>From (UTC)
      <input type="datetime-local" name="period_from" value="{{ period_from_value }}" required>
    </label>
    <label>To (UTC)
      <input type="datetime-local" name="period_to" value="{{ period_to_value }}" required>
    </label>
    <label>Sales channel
      <input type="text" name="sales_channel" value="{{ filters.sales_channel or '' }}">
    </label>
    <label>Attribution
      <select name="attribution_model">
        <option value="last_non_direct"{% if filters.attribution_model == 'last_non_direct' %} selected{% endif %}>last_non_direct</option>
        <option value="first_touch"{% if filters.attribution_model == 'first_touch' %} selected{% endif %}>first_touch</option>
      </select>
    </label>
    <button type="submit">Apply</button>
  </form>
  {% block content %}{% endblock %}
</body>
</html>
