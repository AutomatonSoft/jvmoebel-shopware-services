x-rabbitmq-topology:
  $ref: ./infrastructure/rabbitmq-topology.yaml
  analytics_queue: analytics.shopware.events
  retry_queue: analytics.shopware.events.retry
  dlq: analytics.shopware.events.dlq
  publisher_delivery_mode: 2
  consumer_ack_mode: manual
