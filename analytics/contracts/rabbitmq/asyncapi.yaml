    refundCreatedMessage:
      name: refund_created
      contentType: application/json
      payload:
        $ref: ./schemas/events/refund-created.event.schema.json
      bindings:
        amqp:
          contentEncoding: utf-8
          messageType: refund_created
          bindingVersion: 0.3.0
    contactReceivedMessage:
      name: contact_received
      contentType: application/json
