      bindings:
        amqp:
          contentEncoding: utf-8
          messageType: order_paid
          bindingVersion: 0.3.0
    orderCancelledMessage:
      name: order_cancelled
      contentType: application/json
      payload:
        $ref: ./schemas/events/order-cancelled.event.schema.json
      bindings:
        amqp:
          contentEncoding: utf-8
          messageType: order_cancelled
          bindingVersion: 0.3.0
    manualSaleCreatedMessage:
      name: manual_sale_created
      contentType: application/json
      payload:
        $ref: ./schemas/events/manual-sale-created.event.schema.json
      bindings:
        amqp:
          contentEncoding: utf-8
          messageType: manual_sale_created
          bindingVersion: 0.3.0
    manualSaleUpdatedMessage:
      name: manual_sale_updated
      contentType: application/json
      payload:
        $ref: ./schemas/events/manual-sale-updated.event.schema.json
      bindings:
