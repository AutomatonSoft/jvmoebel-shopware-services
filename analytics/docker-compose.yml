name: analytics

services:
  postgres_db:
    image: postgres:16
    container_name: jvmoebel_analytics_postgres
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: jvmoebel_analytics_rabbitmq
    hostname: rabbitmq
    restart: always
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_CONSUMER_USER:?RABBITMQ_CONSUMER_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_CONSUMER_PASSWORD:?RABBITMQ_CONSUMER_PASSWORD is required}
      RABBITMQ_DEFAULT_VHOST: shopware-analytics
      RABBITMQ_PUBLISHER_USER: ${RABBITMQ_PUBLISHER_USER:?RABBITMQ_PUBLISHER_USER is required}
      RABBITMQ_PUBLISHER_PASSWORD: ${RABBITMQ_PUBLISHER_PASSWORD:?RABBITMQ_PUBLISHER_PASSWORD is required}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/entrypoint.sh:/usr/local/bin/analytics-rabbitmq-entrypoint.sh:ro
      - ./rabbitmq/init-users.sh:/usr/local/bin/init-users.sh:ro
    entrypoint:
      - /bin/bash
      - /usr/local/bin/analytics-rabbitmq-entrypoint.sh
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jvmoebel_analytics_migrations
    restart: "no"
    env_file:
      - .env
    depends_on:
      postgres_db:
        condition: service_healthy
    working_dir: /app
    environment:
      PYTHONPATH: /app/app
    command:
      - uv
      - run
      - alembic
      - upgrade
      - head

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jvmoebel_analytics_backend
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:${PORT:-8002}:8000"
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    working_dir: /app
    environment:
      PYTHONPATH: /app/app
    command:
      - uv
      - run
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jvmoebel_analytics_worker
    restart: always
    env_file:
      - .env
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    working_dir: /app
    environment:
      PYTHONPATH: /app/app
    command:
      - uv
      - run
      - python
      - -m
      - worker

volumes:
  postgres_data:
  rabbitmq_data:
