[project]
name = "jvmoebel-analytics"
version = "0.1.0"
description = "Analytics backend for dashboard and event ingestion"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=9.5.0",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "jsonschema>=4.25.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
]

[tool.pyright]
extraPaths = ["app"]

[[tool.pyright.executionEnvironments]]
root = "app"
extraPaths = []
