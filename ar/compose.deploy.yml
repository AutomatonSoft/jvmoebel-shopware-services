services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      AR_WRITE_API_KEY: ${AR_WRITE_API_KEY:?AR_WRITE_API_KEY is required}
      AR_MAX_FILE_SIZE: ${AR_MAX_FILE_SIZE:-15728640}
      AR_MAX_BODY_SIZE: ${AR_MAX_BODY_SIZE:-16777216}
      PYTHONPATH: /app/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database
    command:
      - uv
      - run
      - alembic
      - upgrade
      - head

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      AR_WRITE_API_KEY: ${AR_WRITE_API_KEY:?AR_WRITE_API_KEY is required}
      AR_MAX_FILE_SIZE: ${AR_MAX_FILE_SIZE:-15728640}
      AR_MAX_BODY_SIZE: ${AR_MAX_BODY_SIZE:-16777216}
      PYTHONPATH: /app/app
    depends_on:
      migrations:
        condition: service_completed_successfully
    volumes:
      - ar_models_data:/app/app/storage/ar_models
    networks:
      - database
      - application
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/hello/', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  database:
    internal: true

  application:
    external: true
    name: ${APP_NETWORK:?APP_NETWORK is required}

volumes:
  postgres_data:
  ar_models_data: