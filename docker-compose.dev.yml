version: '3.9'

services:
  postgres_db_dev:
    image: postgres:16
    container_name: jvmoebel_postgres_dev
    restart: always
    env_file:
      - .env.dev
    ports:
      - "${POSTGRES_DEV_EXTERNAL_PORT:-5436}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend_dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: jvmoebel_backend_dev
    restart: always
    env_file:
      - .env.dev
    ports:
      - "${PORT_DEV:-8001}:8000"
    depends_on:
      postgres_db_dev:
        condition: service_healthy
    volumes:
      - .:/app
      - backend_venv_dev:/app/.venv
      - ar_models_data_dev:/app/app/storage/ar_models
    working_dir: /app
    environment:
      PYTHONPATH: /app/app
    command: >
      uv run uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

volumes:
  postgres_data_dev:
  backend_venv_dev:
  ar_models_data_dev: